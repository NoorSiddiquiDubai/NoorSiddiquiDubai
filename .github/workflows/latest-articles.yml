name: Latest articles
on:
  schedule:
    - cron: "0 3 * * *"   # daily 07:00 UAE
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@N_Siddiqui555"
          max_post_count: 5
          commit_message: "Profile: refresh latest articles"
